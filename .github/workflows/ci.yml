name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.4.2"
      install-policy: "project"
      coverage-path: "coverage"
      test-command: "bun run test:coverage"
      typecheck-command: "bun run lint"
      lint-command: "bun run lint:biome"
    secrets: inherit

  l3:
    name: L3 Browser E2E
    uses: nocoo/base-ci/.github/workflows/test-job.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.4.2"
      install-policy: "blocked"
      browser: "chromium"
      timeout-minutes: 20
      command: "bun run test:e2e:bdd"
      env-json: |-
        {
          "CI": "true"
        }

  l2:
    name: L2 API E2E (local wrangler dev)
    needs: quality
    uses: nocoo/base-ci/.github/workflows/test-job.yml@2857469cc5206e7a4988171a1282209617996a67
    with:
      runtime-version: "1.4.2"
      node-version: "22.12.0"
      install-policy: "blocked"
      timeout-minutes: 10
      pre-command: |
        bun run --cwd packages/core build
        bun run --cwd packages/cli build
        bun run --cwd packages/api build
        bun run build
      command: "bun run test:l2"
