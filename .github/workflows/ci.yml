name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: "project"
      coverage-path: "coverage"
      test-command: "bun run test:coverage"
      typecheck-command: "bun run lint"
      lint-command: "bun run lint:biome"

  l3:
    name: L3 Browser E2E (built SPA and local Worker)
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: "blocked"
      browser: "chromium"
      timeout-minutes: 20
      command: "bun run test:e2e && bun run test:e2e:bdd"
      env-json: |-
        {
          "CI": "true"
        }

  l2:
    name: L2 API E2E (local wrangler dev)
    needs: quality
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: "blocked"
      timeout-minutes: 10
      pre-command: |
        bun run --cwd packages/core build
        bun run --cwd apps/cli build
        bun run --cwd packages/api build
        bun run build
      command: "bun run test:l2"

  web-build:
    name: Web production build and Worker tests
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: "blocked"
      timeout-minutes: 10
      command: "bun run deploy:check && bun run test:worker"
