# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1–S3, G1–G2, B1, L1, L1.5, L2, L3, Z1 via quality.yml;
# na P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L2/L3 prepare commands.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: project
      coverage-path: coverage
      typecheck-command: bun run typecheck
      lint-command: bun run lint:biome
      test-command: bun run test:coverage
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      worker: true
      worker-command: bun run deploy:check && bun run test:worker
      l2: true
      l2-command: >-
        bun run --cwd packages/core build &&
        bun run --cwd apps/cli build &&
        bun run --cwd packages/api build &&
        bun run build &&
        bun run test:l2
      l3: true
      l3-browser: chromium
      l3-prepare-command: |
        bun run --cwd packages/core build
        bun run --cwd apps/cli build
        bun run --cwd packages/api build
        bun run build
      l3-command: bun run test:e2e && bun run test:e2e:bdd
      env-json: '{"CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "impl"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "根 package.json 为 private，CI 无 npm pack / publint 门禁"},
        "Z1": {"status": "impl"}}
