name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    name: Deploy Worker (production)
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
    with:
      auto-rollback: true
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: "blocked"
      artifact-name: b1-build
      artifact-path: .
      wrangler-working-directory: "apps/api"
      environment: production
      concurrency-group: deploy-otter-production
      timeout-minutes: 15
      verify-command: "bun run verify:web https://otter.worker.hexly.ai"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
