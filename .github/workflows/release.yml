name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: "Successful CI run ID to deploy"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Worker (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@3d2e9e55fdd60aa756df454ded53ef6d06d6653f
    with:
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
      runtime-version: "1.4.2"
      install-policy: "blocked"
      build-command: "bun run build"
      wrangler-version: "4.130.0"
      wrangler-working-directory: "packages/worker"
      environment: production
      concurrency-group: deploy-otter-production
      timeout-minutes: 15
      verify-command: |
        STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://otter.hexly.ai/api/live || true)
        test "$STATUS" = "200" || test "$STATUS" = "401"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
