name: macOS

on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "apps/cli/**"
      - "packages/core/**"
      - "bun.lock"
      - "package.json"
      - "scripts/build-macos.sh"
      - "scripts/build-macos-cli.sh"
      - "scripts/test-macos*"
      - "scripts/verify-macos-package.py"
      - ".github/workflows/macos.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "apps/cli/**"
      - "packages/core/**"
      - "bun.lock"
      - "package.json"
      - "scripts/build-macos.sh"
      - "scripts/build-macos-cli.sh"
      - "scripts/test-macos*"
      - "scripts/verify-macos-package.py"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native core and workspace UI
    uses: nocoo/base-ci/.github/workflows/test-job.yml@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
    with:
      runner: "macos-26"
      runtime: "bun"
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: "blocked"
      timeout-minutes: 25
      pre-command: "command -v xcodegen >/dev/null || brew install xcodegen"
      command: "bun run macos:test"
      artifact-name: "macos-native-tests"
      artifact-path: |
        build/macos/Logs/Test
        build/macos-native/*/results
        build/macos-native/*/*.log
  package:
    name: Universal app and standalone CLI package
    uses: nocoo/base-ci/.github/workflows/test-job.yml@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
    with:
      runner: "macos-26"
      runtime: "bun"
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: "blocked"
      timeout-minutes: 25
      pre-command: "command -v xcodegen >/dev/null || brew install xcodegen"
      command: "bun run macos:package"
      artifact-name: "otter-macos-unsigned"
      artifact-path: "build/macos-release"
