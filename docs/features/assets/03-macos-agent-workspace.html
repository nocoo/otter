  <dialog id="dialog" aria-labelledby="dialog-title"><header class="dialog-header"><strong id="dialog-title">预览</strong><span class="spacer"></span><button class="button quiet small" data-action="close-dialog" aria-label="关闭对话框">✕</button></header><div class="dialog-body" id="dialog-body"></div><footer class="dialog-actions" id="dialog-actions"></footer></dialog>
  <div id="toast" role="status" hidden></div>
  <script>
    const workspace = document.getElementById("workspace");
    const dialog = document.getElementById("dialog");
    const titleMap = {overview:"本机配置",agents:"Agents",instructions:"指令与命令",workflow:"来源关系",skills:"Skills 编辑器",backup:"备份与任务"};
    let currentView = "overview", currentFile = "SKILL.md", editorMode = "source", toastTimer, jobTimer;
    const files = {
      "SKILL.md":"---\nname: workspace-notes\ndescription: \nmetadata:\n  owner: personal\n---\n\n# Workspace notes\n\n整理项目笔记，并保留它们与源文件的关系。\n\n## 使用时机\n\n当用户希望整理项目笔记、补齐引用或检查来源时使用。\n\n## 工作步骤\n\n1. 阅读当前项目的笔记目录。\n2. 按主题组织内容，保留原始引用。\n3. 列出无法解析的链接，交由用户确认。\n\n## 支持文件\n\n参阅 [引用约定](references/conventions.md)。\n\n检查脚本：scripts/check-links.sh\n",
      "references/conventions.md":"# 引用约定\n\n保留原始出处，使用相对路径连接当前 skill 包中的文件。\n\n## 本地资源\n\n- 记录资源的实际位置。\n- 文件移动后，更新受管理的引用。\n- 无法确认的来源保留为待核对。\n",
      "scripts/check-links.sh":"#!/bin/sh\n# 示例脚本，仅用于编辑预览。\nset -eu\nprintf '%s\\n' 'Ready to check local references.'\n",
      "agents/openai.yaml":"interface:\n  display_name: \"Workspace Notes\"\n  short_description: \"整理项目笔记并保持来源可追溯\"\n  default_prompt: \"Use $workspace-notes to organize these notes.\"\n\npolicy:\n  allow_implicit_invocation: true\n"
    };
    const dirtyFiles = new Set();
    const icon = (name) => '<svg class="icon" aria-hidden="true"><use href="#'+name+'"/></svg>';
    function showToast(message) { const node=document.getElementById("toast"); node.textContent=message;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,3200); }
    function showView(view) {
      clearInterval(jobTimer); currentView=view;
      workspace.replaceChildren(document.getElementById("view-"+view).content.cloneNode(true));
      document.getElementById("toolbar-title").textContent=titleMap[view];
      document.querySelectorAll(".nav-item").forEach(button=>{button.classList.toggle("active",button.dataset.view===view);if(button.dataset.view===view)button.setAttribute("aria-current","page");else button.removeAttribute("aria-current");});
      if(view==="agents") selectAgent("Codex");
      if(view==="instructions") renderInstructions("instructions");
      if(view==="workflow") renderGraph("instructions");
      if(view==="skills") {renderEditor();const input=document.getElementById("skill-editor");input.wrap="off";input.addEventListener("scroll",()=>{document.getElementById("line-numbers").scrollTop=input.scrollTop;});input.addEventListener("input",()=>{files[currentFile]=input.value;dirtyFiles.add(currentFile);renderEditorMeta();});document.getElementById("metadata-description").addEventListener("input",event=>setDescription(event.target.value));}
    }
    function row(name,path,badge,tone="neutral") { return '<div class="path-row">'+icon("doc")+'<div class="path-name"><strong>'+name+'</strong><small>'+path+'</small></div><span class="badge '+tone+'">'+badge+'</span></div>'; }
    function selectAgent(name) {
      document.querySelectorAll("[data-agent]").forEach(button=>button.classList.toggle("selected",button.dataset.agent===name));
      document.getElementById("agent-title").textContent=name;
      const verified=name==="Codex"||name==="Grok";
      document.getElementById("agent-state").textContent=verified?"已验证新进程":"发现状态待验证";
      document.getElementById("agent-state").className="badge "+(verified?"good":"neutral");
      const descriptions={Codex:"文件入口和运行时发现，放在一起核对。",Grok:"原生 hooks 与 Claude 兼容资源分别管理。","Claude Code":"全局指令、专用 skill 入口与项目配置。",Pi:"共享 skills、prompt templates 和独立版本的 extensions。",Hermes:"每个 profile 有独立的身份、记忆与 skill 入口。",OpenCode:"配置仍可查看与编辑，当前 PATH 尚未定位 CLI。",Gemini:"全局 GEMINI.md 已链接到 Workflow。"};
      document.getElementById("agent-description").textContent=descriptions[name];
      const notices={Codex:"旧 instructions.md 不在默认加载链中",Grok:"共享桶中的新 skill 已在仓库外发现","Claude Code":"新 skill 专用链接缺失，原生发现待核对",Pi:"Prompt 与 extension 使用各自的注册入口",Hermes:"default 和 cherry 的配置分别管理",OpenCode:"配置存在，CLI 未定位",Gemini:"配置存在，CLI 未定位"};
      document.getElementById("agent-notice").innerHTML=icon(verified&&name!=="Codex"?"check":"warning")+'<div><strong>'+notices[name]+'</strong>当前详情来自调查快照，运行时状态按版本与上下文记录。</div>';
      const rows={Codex:[row("共享 skills","~/.agents/skills","已发现","good"),row("两条 Herdr skill","~/.codex/skills/su-herdr-*","已启用","good"),row("旧 instructions.md","~/.codex/instructions.md","入口未配置","warning"),row("Legacy prompts","~/.codex/prompts · 11 个链接","旧版菜单不可用","warning")],Grok:[row("共享 skills","~/.agents/skills","已发现","good"),row("共享 commands","~/.claude/commands","已发现","good"),row("原生 rules / hooks","~/.grok/rules · ~/.grok/hooks","安装自检通过","good")],"Claude Code":[row("全局指令","~/.claude/CLAUDE.md → Workflow","实时共享"),row("Workflow skills","~/.claude/skills · 20/21 专用入口","待核对","warning"),row("Commands","~/.claude/commands · 13/13 链接","文件关系正常","good")],Pi:[row("共享 skills","~/.agents/skills","原生发现路径"),row("Prompt templates","~/.pi/agent/prompts · 13/13 链接","文件关系正常","good"),row("Agent policy","managed-packages/pi-agent-policy/current","发行副本")],Hermes:[row("Default profile","~/.hermes · 23 个直接 skill 链接","多来源"),row("Cherry profile","~/.hermes/profiles/cherry","独立配置"),row("herdr-control","cherry 实体副本与 Workflow 不同","关系待确认","warning")],OpenCode:[row("全局指令","~/.config/opencode/AGENTS.md","实时共享"),row("Workflow skills","20/21 专用入口","运行时待验证"),row("Commands","13/13 文件链接","文件关系正常","good")],Gemini:[row("全局指令","~/.gemini/GEMINI.md → Workflow","实时共享"),row("可执行文件","当前进程 PATH","未定位") ]};
      document.getElementById("agent-resources").innerHTML=rows[name].join("");
      updateContext();
    }
    function updateContext(){const project=document.getElementById("agent-context").value==="project";document.getElementById("agent-scope").textContent=project?"项目来源与用户来源分别检查":"共享用户目录 / profile 入口";document.getElementById("agent-path").textContent=project?"workflow/.agents/skills → agents/skills":"~/.agents/skills · 各 harness 的用户入口";}
    function renderInstructions(tab) {
      document.querySelectorAll("[data-instruction-tab]").forEach(button=>button.classList.toggle("selected",button.dataset.instructionTab===tab));
      const content={instructions:'<div class="notice">'+icon("warning")+'<div><strong>Codex：内容不同，默认入口未配置</strong>先比较副本，再确认当前版本支持的全局指令入口。</div></div><div class="section-heading"><h3>Workflow / agents / AGENTS.md</h3><span class="spacer"></span><span class="badge">Canonical source</span></div><div class="list-card">'+row("Claude Code","~/.claude/CLAUDE.md","实时链接")+row("OpenCode","~/.config/opencode/AGENTS.md","实时链接")+row("Gemini","~/.gemini/GEMINI.md","实时链接")+row("Codex","~/.codex/instructions.md","内容不同","warning")+'</div><p class="hint">修改共享源会影响链接消费者；Codex 的实体文件需要独立同步。</p>',commands:'<div class="notice good">'+icon("check")+'<div><strong>13 个共享 command 入口</strong>Claude、OpenCode、Pi 的文件链接均正确。调用格式依 harness 而异。</div></div><div class="section-heading"><h3>一个正文，多种调用方式</h3></div><div class="list-card">'+row("su-herdr-grok","agents/command-skills/su-herdr-grok/SKILL.md","源正文")+row("Claude / Grok / Pi","/su-herdr-grok &lt;task&gt;","Command")+row("Codex","$su-herdr-grok &lt;task&gt;","Skill")+row("Hermes","/su-herdr-grok &lt;task&gt;","Profile skill")+'</div><p class="hint">Codex 的旧 prompts 目录单独标注；文件存在不等于注册成功。</p>',rules:'<div class="notice good">'+icon("check")+'<div><strong>两套 hooks 的安装自检通过</strong>Claude 与 Grok 各自使用原生脚本和注册格式。</div></div><div class="section-heading"><h3>格式与目标</h3></div><div class="list-card">'+row("共享 Markdown rules","Claude / OpenCode / Grok · 各 6 个链接","实时共享")+row("Claude hooks","Bash · PreToolUse","独立注册")+row("Grok hooks","run_terminal_command · camelCase payload","独立注册")+row("Codex permission rules","prefix_rule(...) · .rules","原生 DSL")+'</div>'};
      document.getElementById("instruction-content").innerHTML=content[tab];
    }
    const graphData={instructions:[{name:"Claude Code",path:"~/.claude/CLAUDE.md",kind:"link",detail:"文件软链接直接指向 Workflow。保存源文件时保留入口链接。"},{name:"OpenCode",path:"~/.config/opencode/AGENTS.md",kind:"link",detail:"链接关系正常；当前 PATH 没有定位 OpenCode，原生加载尚未验证。"},{name:"Gemini",path:"~/.gemini/GEMINI.md",kind:"link",detail:"链接关系正常；当前 PATH 没有定位 Gemini，原生加载尚未验证。"},{name:"Codex",path:"~/.codex/instructions.md",kind:"copy",detail:"SETUP 中的旧拷贝入口，内容已不同；当前默认配置没有加载该文件。"}],command:[{name:"Claude / OpenCode / Pi",path:"commands/su-herdr-grok.md → command-skills",kind:"link",detail:"command 入口通过文件别名指向同一个 SKILL.md；Grok 从 Claude command 兼容入口发现。"},{name:"Codex",path:"~/.codex/skills/su-herdr-grok",kind:"link",detail:"整个 skill 目录链接到 Workflow，本次 native skills/list 确认启用。"},{name:"Hermes default",path:"~/.hermes/skills/su-herdr-grok",kind:"link",detail:"profile 下的 skill 目录链接，调用方式为 /su-herdr-grok。"}]};
    function renderGraph(type){document.getElementById("graph-title").textContent=type==="instructions"?"AGENTS.md":"su-herdr-grok / SKILL.md";document.getElementById("graph-source-path").textContent=type==="instructions"?"workflow/agents/AGENTS.md":"workflow/agents/command-skills/su-herdr-grok/SKILL.md";document.getElementById("graph-branches").innerHTML=graphData[type].map((entry,index)=>'<button class="graph-entry '+(entry.kind==="copy"?"copied":"")+'" data-graph-entry="'+index+'">'+icon(entry.kind==="copy"?"copy":"link")+'<span class="path-name"><strong>'+entry.name+'</strong><small>'+entry.path+'</small></span><span class="badge '+(entry.kind==="copy"?"warning":"")+'">'+(entry.kind==="copy"?"拷贝 · 内容不同":"实时共享")+'</span></button>').join("");selectGraphEntry(type==="instructions"?3:0);}
    function selectGraphEntry(index){const type=document.getElementById("graph-resource").value,entry=graphData[type][index];document.querySelectorAll("[data-graph-entry]").forEach(button=>button.classList.toggle("selected",Number(button.dataset.graphEntry)===index));document.getElementById("graph-inspector").innerHTML='<h3>'+entry.name+'</h3><span class="badge '+(entry.kind==="copy"?"warning":"")+'">'+(entry.kind==="copy"?"独立实体文件":"链接入口")+'</span><dl class="key-value"><dt>逻辑入口</dt><dd class="mono">'+entry.path+'</dd></dl><h4>这意味着什么</h4><p>'+entry.detail+'</p><div class="separator"></div><h4>可执行操作</h4><button class="button primary" data-action="'+(entry.kind==="copy"?"review":"source-info")+'">'+(entry.kind==="copy"?"预览处理步骤":"查看源与影响")+'</button><p class="hint">文件关系与运行时发现分别记录。不会把其他来源的条目纳入一次同步。</p>';}
    function renderEditor(){const input=document.getElementById("skill-editor");input.value=files[currentFile];input.hidden=editorMode!=="source";document.getElementById("line-numbers").hidden=editorMode!=="source";const preview=document.getElementById("skill-preview");preview.hidden=editorMode!=="preview";preview.textContent=currentFile==="SKILL.md"?files[currentFile].replace(/^---[\s\S]*?---\n/,""):files[currentFile];document.getElementById("file-title").textContent=currentFile.split("/").pop();document.querySelectorAll("[data-file]").forEach(button=>button.classList.toggle("selected",button.dataset.file===currentFile));document.querySelectorAll("[data-editor-mode]").forEach(button=>button.classList.toggle("selected",button.dataset.editorMode===editorMode));renderEditorMeta();}
    function renderEditorMeta(){document.getElementById("line-numbers").textContent=files[currentFile].split("\n").map((_,i)=>i+1).join("\n");document.getElementById("dirty-dot").hidden=!dirtyFiles.has(currentFile);const name=files["SKILL.md"].match(/^name:[ \t]*([^\n]*)$/m)?.[1]?.trim();const description=files["SKILL.md"].match(/^description:[ \t]*([^\n]*)$/m)?.[1]?.trim()||"";const valid=Boolean(name&&description);document.getElementById("validation-badge").textContent=valid?"示例必填项通过":"必填项缺失";document.getElementById("validation-badge").className="badge "+(valid?"good":"warning");document.getElementById("skill-problem").hidden=valid;document.querySelector("#skill-problem strong").textContent=!name?"name 不能为空":"description 不能为空";document.getElementById("validation-summary").textContent=valid?"示例必填项检查通过":"SKILL.md · 请补全必填元数据";const field=document.getElementById("metadata-description");if(document.activeElement!==field)field.value=description;}
    function setDescription(value){files["SKILL.md"]=files["SKILL.md"].replace(/^description:[^\n]*$/m,"description: "+value);dirtyFiles.add("SKILL.md");if(currentFile==="SKILL.md")document.getElementById("skill-editor").value=files[currentFile];renderEditorMeta();}
    function openDialog(title,html,buttons){document.getElementById("dialog-title").textContent=title;document.getElementById("dialog-body").innerHTML=html;const actions=document.getElementById("dialog-actions");actions.replaceChildren();for(const [label,action,primary]of buttons){const button=document.createElement("button");button.textContent=label;button.dataset.action=action;button.className="button"+(primary?" primary":"");actions.append(button);}dialog.showModal();}
    function startJob(){let completed=0;document.getElementById("start-job").disabled=true;document.getElementById("upload-job").disabled=true;document.getElementById("cancel-job").hidden=false;document.getElementById("job-state").textContent="采集中 · 演示";jobTimer=setInterval(()=>{completed++;document.getElementById("job-progress").style.width=(completed/13*100)+"%";document.getElementById("job-scan-result").textContent=completed+" / 13 · 示例";if(completed===13){clearInterval(jobTimer);document.getElementById("job-state").textContent="待检查";document.getElementById("job-title").textContent="本地预览已准备好";document.getElementById("job-preview-result").textContent="示例快照，尚未上传";document.getElementById("cancel-job").hidden=true;document.getElementById("start-job").disabled=false;document.getElementById("upload-job").disabled=false;}},120);}
    function action(name){
      if(name==="theme")document.body.classList.toggle("dark");
      if(name==="scan")showToast("草图保留 2026-09-15 的调查快照；没有执行本机扫描。");
      if(name==="close-dialog")dialog.close();
      if(name==="save"){dirtyFiles.clear();if(currentView==="skills")renderEditorMeta();showToast("示例草稿保留在当前页面，未写入本机文件。");}
      if(name==="fix"){setDescription("Organize project notes and preserve links to their source files.");showToast("已补全示例描述，可继续编辑正文与附属文件。");}
      if(name==="review")openDialog("Codex 指令 · 处理预览",'<span class="badge warning">需要用户选择内容</span><p>源文件与本地副本不同，先比较后决定保留或合并。</p><div class="list-card">'+row("1. 处理内容差异","Workflow 源 ↔ 本地 instructions.md","双栏比较")+row("2. 建立受支持的全局入口","核对当前版本的 AGENTS.md 发现规则","独立变更")+row("3. 再次验证发现","记录 cwd、版本与时间","检查结果")+'</div><p>每项会展示具体路径、前后内容和影响范围。此草图不应用配置。</p>',[["返回","close-dialog",false],["查看来源关系","dialog-workflow",true]]);
      if(name==="dialog-workflow"){dialog.close();showView("workflow");}
      if(name==="fork")openDialog("herdr-control · 确认关系",'<span class="badge neutral">同名不同内容</span><p>cherry 的实体副本是 8,654 bytes，Workflow 源是 8,685 bytes。目前没有同步基线，不能判定哪一份应覆盖另一份。</p><p>目标交互：双栏比较后，可以保留独立分叉、建立受管理副本，或改为使用已确认的源。</p>',[["保留待核对","close-dialog",true]]);
      if(name==="source-info")openDialog("编辑源文件的影响",'<p>保存操作写入解析后的源文件，保留所有入口软链接。已登记的消费者会更新文件层状态，运行时发现与旧会话刷新单独检查。</p><p>如果源已被外部编辑或链接重指向，先合并并重新预览。</p>',[["知道了","close-dialog",true]]);
      if(name==="publish")openDialog("示例 skill · 分发预览",'<span class="badge neutral">示例，不写入磁盘</span><p>把同一个 skill 包注册到所选消费者。保留汇集目录内来自其他来源的条目。</p><div class="list-card">'+row("Claude","用户 skills → 共享桶 → Workflow","逐包链接")+row("Codex / Pi","发现 ~/.agents/skills 中的包","共享发现")+row("Hermes default","profile skills → Workflow","逐包链接")+'</div><p>正式 App 会检查每个目标版本、现有入口、格式和冲突，再生成可撤销变更。</p>',[["继续编辑","close-dialog",true]]);
      if(name==="start-job")startJob();
      if(name==="cancel-job"){clearInterval(jobTimer);document.getElementById("job-state").textContent="已取消 · 演示";document.getElementById("cancel-job").hidden=true;document.getElementById("start-job").disabled=false;}
      if(name==="upload-job")openDialog("检查将要上传的快照",'<span class="badge neutral">示例快照</span><p>正式 App 会列出实际文件内容、清单、遮盖结果、目标 API 和快照 ID。上传使用这个已确认的对象，不重新扫描。</p><p>这个界面草图不会发送网络请求。</p>',[["返回预览","close-dialog",false],["完成演示","complete-demo",true]]);
      if(name==="complete-demo"){dialog.close();document.getElementById("job-state").textContent="演示完成";document.getElementById("job-upload-result").textContent="未执行实际上传";document.getElementById("upload-job").disabled=true;}
      if(name==="search"){openDialog("搜索资源",'<input class="search-input" id="resource-search" aria-label="搜索资源名称" placeholder="输入 skill、harness、路径或问题…"><div class="search-result" id="search-results"></div>',[["关闭","close-dialog",false]]);const input=document.getElementById("resource-search");input.addEventListener("input",()=>renderSearch(input.value));renderSearch("");input.focus();}
    }
    function renderSearch(query){const entries=[["Codex · 旧指令的加载入口","instructions"],["Workflow · AGENTS.md 来源关系","workflow"],["workspace-notes · 示例 skill 包","skills"],["Otter CLI · 备份与任务","backup"]];const result=document.getElementById("search-results");result.replaceChildren();for(const [label,view]of entries.filter(([label])=>label.toLowerCase().includes(query.toLowerCase()))){const button=document.createElement("button");button.className="button";button.textContent=label;button.dataset.searchView=view;result.append(button);}if(!result.childElementCount)result.textContent="没有匹配的示例资源。";}
    document.addEventListener("click",event=>{const button=event.target.closest("button");if(!button)return;if(button.dataset.view)showView(button.dataset.view);else if(button.dataset.action)action(button.dataset.action);else if(button.dataset.agent)selectAgent(button.dataset.agent);else if(button.dataset.instructionTab)renderInstructions(button.dataset.instructionTab);else if(button.dataset.graphEntry!==undefined)selectGraphEntry(Number(button.dataset.graphEntry));else if(button.dataset.file){currentFile=button.dataset.file;renderEditor();}else if(button.dataset.editorMode){editorMode=button.dataset.editorMode;renderEditor();}else if(button.dataset.searchView){dialog.close();showView(button.dataset.searchView);}});
    document.addEventListener("change",event=>{if(event.target.id==="graph-resource")renderGraph(event.target.value);if(event.target.id==="agent-context")updateContext();});
    document.addEventListener("keydown",event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="k"){event.preventDefault();if(!dialog.open)action("search");}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==="s"&&currentView==="skills"){event.preventDefault();action("save");}});
    showView("overview");
  </script>
